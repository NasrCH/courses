name = "courses-duo-notifications"
main = "worker.js"
compatibility_date = "2024-01-01"

# Variables publiques (non secrètes)
[vars]
FIREBASE_PROJECT_ID = "misfit-game"

# ⚠️  Les secrets sont à définir via la commande :
#   wrangler secret put SERVICE_ACCOUNT_EMAIL
#   wrangler secret put SERVICE_ACCOUNT_PRIVATE_KEY
#
# Ou dans le Dashboard Cloudflare :
#   Workers > courses-duo-notifications > Settings > Variables > Add variable (choisir "Encrypt")

